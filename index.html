<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Topic Bank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf9f7; --panel:#fff; --ink:#15140f; --soft:#4a4740; --faint:#8a857a;
  --line:#e2ded5; --line2:#efece5;
  --accent:#02005E; --accent-soft:#eceaf6; --on-accent:#fff;
  --warm:#8a5a09; --warm-soft:#f8efdc;
  --done:#5a5a5a; --done-soft:#edebe6;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131210; --panel:#1b1a17; --ink:#f2efe8; --soft:#bdb8ac; --faint:#8b857a;
  --line:#2e2c27; --line2:#252320;
  --accent:#a9a4f0; --accent-soft:#232140; --on-accent:#11102a;
  --warm:#e0b366; --warm-soft:#2d2415;
  --done:#a3a3a0; --done-soft:#262623;
}}
:root[data-theme="dark"]{
  --bg:#131210; --panel:#1b1a17; --ink:#f2efe8; --soft:#bdb8ac; --faint:#8b857a;
  --line:#2e2c27; --line2:#252320;
  --accent:#a9a4f0; --accent-soft:#232140; --on-accent:#11102a;
  --warm:#e0b366; --warm-soft:#2d2415;
  --done:#a3a3a0; --done-soft:#262623;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:36px 16px 40px}

header{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:16px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:clamp(32px,5vw,46px);line-height:1.04;letter-spacing:-.018em;margin:0 0 10px}
.lede{font-size:14.5px;line-height:1.5;color:var(--soft);max-width:62ch;margin:0}
.lede em{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:16px;color:var(--ink)}

.hist{margin:0 0 18px;padding:11px 0 0;border-top:1px solid var(--line2)}
.hist .hl{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.hist ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.hist li{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--done);background:var(--done-soft);border-radius:4px;padding:3px 7px;white-space:nowrap}
.hist li.next{color:var(--accent);background:var(--accent-soft)}
.hist li.gap{color:var(--warm);background:var(--warm-soft)}

.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.rowlabel{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);width:100%;margin:10px 0 1px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-family:inherit;font-size:12.5px;color:var(--soft);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .ct{font-family:"IBM Plex Mono",monospace;font-size:10.5px;opacity:.7;margin-left:5px}
.search{flex:1 1 230px;min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;color:var(--ink);font-family:inherit;font-size:14px}
.search::placeholder{color:var(--faint)}
.search:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 18px;padding-top:12px;border-top:1px solid var(--line2)}
.count{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);margin-right:auto}
.tbtn{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);cursor:pointer}
.tbtn:hover{border-color:var(--faint);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(336px,1fr));gap:12px;align-items:start}
.band{grid-column:1/-1;display:flex;align-items:baseline;gap:9px;margin:6px 0 0}
.band h2{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:22px;letter-spacing:-.012em;margin:0}
.band span{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.card.pk{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.star{position:absolute;top:10px;right:10px;z-index:2;background:none;border:1px solid var(--line);border-radius:999px;
  padding:4px 9px 4px 7px;cursor:pointer;display:none;align-items:center;gap:4px;color:var(--faint);
  font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1}
body.live .star{display:inline-flex}
.star:hover{border-color:var(--warm);color:var(--warm)}
.star svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7}
.star.on{color:var(--warm);border-color:var(--warm);background:var(--warm-soft)}
.star.on svg{fill:currentColor}
.hd{padding:15px 16px 13px}
body.live .hd{padding-right:74px}
.n{font-family:Newsreader,Georgia,serif;font-size:20px;line-height:1.2;font-weight:500;letter-spacing:-.01em;margin:0 0 5px}
.s{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:16px;line-height:1.38;margin:0 0 8px}
.b{font-size:13.5px;line-height:1.52;color:var(--soft);margin:0}
.foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 16px 13px}
.tag{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.tag.cat{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.more{margin-left:auto;display:inline-flex;align-items:center;gap:5px;background:none;cursor:pointer;
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 9px 3px 10px}
.more::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;transition:transform .15s}
.more:hover{background:var(--accent);color:var(--on-accent)}
.card.on .more::after{transform:rotate(180deg)}
.body{display:none;border-top:1px solid var(--line2);padding:13px 16px 15px}
.card.on .body{display:block}
.sec{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.sec+.sec{margin-top:15px}
ol.ang{list-style:none;margin:0;padding:0;counter-reset:t}
ol.ang li{counter-increment:t;position:relative;padding:8px 0 8px 30px;border-top:1px solid var(--line2);font-size:13.5px;line-height:1.45}
ol.ang li:first-child{border-top:0;padding-top:2px}
ol.ang li::before{content:counter(t);position:absolute;left:0;top:8px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--accent);border:1px solid var(--line);border-radius:3px;width:19px;height:19px;display:grid;place-items:center}
ol.ang li:first-child::before{top:2px}
.at{display:block;font-weight:500}
.ad{display:block;font-family:Newsreader,Georgia,serif;font-style:italic;font-size:13px;line-height:1.4;color:var(--soft);margin-top:1px}
.ev{margin:15px 0 0;padding:0;list-style:none}
.ev li{font-size:12.5px;line-height:1.45;color:var(--soft);padding:6px 0;border-top:1px solid var(--line2)}
.ev li:first-child{border-top:0}
.ev q{font-style:italic}
.ev cite{display:block;font-family:"IBM Plex Mono",monospace;font-style:normal;font-size:10.5px;color:var(--faint);margin-top:2px}
.notes{margin:13px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.notes li{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--warm);background:var(--warm-soft);border-radius:4px;padding:3px 7px}

.ideas{display:none;margin:0 16px 13px;border-top:1px solid var(--line2);padding-top:10px}
body.live .ideas{display:block}
ul.ilist{list-style:none;margin:0;padding:0}
ul.ilist li{padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px;line-height:1.45}
ul.ilist:empty{display:none}
ul.ilist+.ibar{margin-top:9px}
.imeta{display:flex;align-items:baseline;gap:8px;margin-top:3px;flex-wrap:wrap}
.iwho{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;color:var(--faint)}
.iact{display:flex;gap:7px;margin-left:auto}
.iact button{background:none;border:0;padding:0;cursor:pointer;color:var(--faint);font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.iact button:hover{color:var(--accent);text-decoration:underline}
.iedit{display:flex;gap:6px;align-items:flex-start;margin-top:2px}
.iedit textarea{flex:1;background:var(--bg);border:1px solid var(--accent);border-radius:7px;padding:6px 9px;color:var(--ink);font-family:inherit;font-size:13px;line-height:1.4;resize:vertical;min-height:32px}
.ibar{display:flex;gap:6px;align-items:flex-start}
.ibar textarea{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;color:var(--ink);font-family:inherit;font-size:13px;line-height:1.4;resize:vertical;min-height:34px}
.ibar textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.ibar button,.iedit .sv{background:var(--accent);color:var(--on-accent);border:0;border-radius:7px;padding:8px 13px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.iedit .cx{background:none;border:1px solid var(--line);color:var(--soft);border-radius:6px;padding:6px 10px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}

.empty{text-align:center;padding:50px 20px;color:var(--faint);font-family:Newsreader,Georgia,serif;font-size:18px;font-style:italic}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.6;color:var(--faint);max-width:78ch}

.exp{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;align-items:center;gap:9px;flex-wrap:wrap;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;box-shadow:0 -6px 20px rgba(0,0,0,.07)}
body.bar-on .exp{display:flex}
body.bar-on{padding-bottom:66px}
.exp .tally{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--soft);margin-right:auto}
.exp .tally b{color:var(--ink);font-weight:500}
.exp input{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--ink);font-family:inherit;font-size:13px;width:170px}
.exp input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.exp button{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:7px;padding:6px 12px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.exp button.primary{background:var(--accent);color:var(--on-accent)}
.exp .note{width:100%;font-family:Newsreader,Georgia,serif;font-style:italic;font-size:12px;color:var(--faint);margin:0}
.sync{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
@media(max-width:620px){.grid{grid-template-columns:1fr}.exp .tally{width:100%}.exp input{flex:1;width:auto}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Editorial Planning · H2 2026</div>
  <h1>Health Topic Bank</h1>
  <p class="lede">One card is one email. Open it for the sections that would run inside.<br>
  <em>Star the ones you like and comment straight on the card.</em></p>
</header>

<div class="hist" id="hist"></div>
<div class="bar" id="catbar"></div>
<div class="bar" id="fmtbar"></div>
<div class="bar" id="fbbar" hidden></div>
<div class="bar"><input class="search" id="q" type="search" placeholder="Search topics, sections, sources…" autocomplete="off"></div>
<div class="tools">
  <span class="count" id="count"></span>
  <span class="sync" id="sync"></span>
  <button class="tbtn" id="expand">Expand all</button>
  <button class="tbtn" id="collapse">Collapse all</button>
</div>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>Nothing matches that.</div>
<footer id="foot"></footer>
</div>

<div class="exp" id="exp">
  <span class="tally" id="tally"></span>
  <input id="who" type="text" placeholder="Your name (so we know who)" autocomplete="name">
  <button type="button" id="copyFb">Copy</button>
  <button type="button" id="mailFb">Email it</button>
  <button type="button" class="primary" id="dlFb">Download</button>
  <p class="note" id="expnote"></p>
</div>

const HIST = [{"t": "NL 17 Brain Wealth"}, {"t": "NL 18 Peptides"}, {"t": "NL 19 Cyclosporiasis"}, {"t": "NL 20 Healthspan"}, {"t": "NL 21 GLP-1s"}, {"t": "NL 22 Cholesterol"}, {"t": "NL 23 Screen Time"}, {"t": "NL 24 Cold Season"}, {"t": "NL 25 Skincare"}, {"t": "NL 26 Added Sugar", "gap": true}, {"t": "NL 27 Melatonin vs. Magnesium", "next": true}, {"t": "NL 28 Pill Pileup", "next": true}, {"t": "NL 29 Habits vs Dementia", "next": true}, {"t": "Seasonal · September"}, {"t": "Product Feature"}];

const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LK = "htb.v2";

let fCat=null, fFmt=null, fStar=false, q="";
let OPEN = new Set();                 // card ids expanded — survives re-render
let STARS={}, MYSTARS=new Set(), IDEAS={};
let ME="", SHARED=false, LIVE=false;
let L={stars:[],ideas:{},who:""};

/* ---------- local store ---------- */
function lload(){ try{ const r=localStorage.getItem(LK); if(r) L=Object.assign({stars:[],ideas:{},who:""},JSON.parse(r)); }catch(_){} }
function lsave(){ try{ localStorage.setItem(LK,JSON.stringify(L)); }catch(_){} }
function rebuildLocal(){
  MYSTARS=new Set(L.stars||[]);
  STARS={}; MYSTARS.forEach(id=>STARS[id]=1);
  IDEAS={};
  Object.keys(L.ideas||{}).forEach(k=>{
    IDEAS[k]=(L.ideas[k]||[]).map((x,i)=>({id:k+"#"+i,text:x.text,who:L.who||"You",mine:true,ed:!!x.ed,at:x.at}));
  });
}

/* ---------- supabase ---------- */
const api=(p,o={})=>fetch(SB.url.replace(/\/$/,"")+"/rest/v1/"+p,Object.assign({
  headers:{apikey:SB.key,Authorization:"Bearer "+SB.key,"Content-Type":"application/json",Prefer:"return=representation"}
},o));
async function pull(){
  const r=await api("feedback?select=*&order=created_at.asc");
  if(!r.ok) throw new Error(r.status);
  const rows=await r.json();
  STARS={}; MYSTARS=new Set(); IDEAS={};
  rows.forEach(x=>{
    if(x.kind==="star"){ STARS[x.card]=(STARS[x.card]||0)+1; if(x.who===ME) MYSTARS.add(x.card); }
    else (IDEAS[x.card]=IDEAS[x.card]||[]).push({id:x.id,text:x.body||"",who:x.who||"Someone",mine:x.who===ME,ed:!!x.ed,at:x.created_at});
  });
}
async function push(row){ await api("feedback",{method:"POST",body:JSON.stringify(row)}); }
async function patch(id,row){ await api("feedback?id=eq."+id,{method:"PATCH",body:JSON.stringify(row)}); }
async function drop(id){ await api("feedback?id=eq."+id,{method:"DELETE"}); }
async function dropStar(card){ await api("feedback?kind=eq.star&card=eq."+encodeURIComponent(card)+"&who=eq."+encodeURIComponent(ME),{method:"DELETE"}); }

/* ---------- actions ---------- */
async function star(id){
  const on=MYSTARS.has(id);
  if(on){ MYSTARS.delete(id); } else { MYSTARS.add(id); }
  if(SHARED){
    STARS[id]=(STARS[id]||0)+(on?-1:1);
    paint();
    try{ on ? await dropStar(id) : await push({card:id,kind:"star",who:ME}); await pull(); }catch(_){}
    paint(); tally();
  }else{
    L.stars=[...MYSTARS]; lsave(); rebuildLocal(); paint(); tally();
  }
}
async function addIdea(card,text){
  if(SHARED){ try{ await push({card,kind:"comment",who:ME,body:text}); await pull(); }catch(_){} }
  else{ (L.ideas[card]=L.ideas[card]||[]).push({text,at:new Date().toISOString()}); lsave(); rebuildLocal(); }
  paint(); tally();
}
async function saveIdea(cid,text){
  if(SHARED){ try{ await patch(cid,{body:text,ed:true}); await pull(); }catch(_){} }
  else{ const p=String(cid).lastIndexOf("#"),c=String(cid).slice(0,p),i=+String(cid).slice(p+1);
        if(L.ideas[c]&&L.ideas[c][i]){ L.ideas[c][i].text=text; L.ideas[c][i].ed=true; } lsave(); rebuildLocal(); }
  paint(); tally();
}
async function delIdea(cid){
  if(SHARED){ try{ await drop(cid); await pull(); }catch(_){} }
  else{ const p=String(cid).lastIndexOf("#"),c=String(cid).slice(0,p),i=+String(cid).slice(p+1);
        if(L.ideas[c]){ L.ideas[c].splice(i,1); if(!L.ideas[c].length) delete L.ideas[c]; } lsave(); rebuildLocal(); }
  paint(); tally();
}

/* ---------- filters ---------- */
function hit(t){
  if(fCat && t.cat!==fCat) return false;
  if(fFmt && !(t.p||[]).includes(fFmt)) return false;
  if(fStar && !(STARS[t.id])) return false;
  if(!q) return true;
  return [t.n,t.s,t.b,t.cat,...(t.a||[]).flatMap(a=>[a.t,a.d]),...(t.p||[]),...(t.x||[]),...(t.h||[]).flat()]
    .join(" ").toLowerCase().includes(q);
}
function chipRow(el,label,items,get,set){
  el.innerHTML=`<div class="rowlabel">${esc(label)}</div>`+items.map(i=>
    `<button class="chip" data-v="${esc(i.v)}" aria-pressed="false">${esc(i.t)}<span class="ct">${i.c}</span></button>`).join("");
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ set(get()===b.dataset.v?null:b.dataset.v); render(); });
}

/* ---------- render ---------- */
function card(t){
  const open=OPEN.has(t.id);
  const ang=(t.a||[]).map(a=>`<li><span class="at">${esc(a.t)}</span>${a.d?`<span class="ad">${esc(a.d)}</span>`:""}</li>`).join("");
  const ev=(t.h||[]).map(([hh,s])=>`<li><q>${esc(hh)}</q><cite>${esc(s)}</cite></li>`).join("");
  const nx=(t.x||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  const tags=(t.cat?`<span class="tag cat">${esc(t.cat)}</span>`:"")+(t.p||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join("");
  return `<article class="card${t.pick?" pk":""}${open?" on":""}" data-id="${esc(t.id)}">
    <button class="star" data-star="${esc(t.id)}" aria-pressed="false" title="Star this one">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg><span class="sc"></span></button>
    <div class="hd">
      <p class="n">${esc(t.n)}</p>
      <p class="s">${esc(t.s)}</p>
      <p class="b">${esc(t.b)}</p>
    </div>
    <div class="foot">${tags}
      <button type="button" class="more" data-more="${esc(t.id)}" aria-expanded="${open}">${open?"Hide":(t.a||[]).length+" sections"}</button>
    </div>
    <div class="ideas">
      <ul class="ilist" data-ilist="${esc(t.id)}"></ul>
      <div class="ibar" data-ibar="${esc(t.id)}"></div>
    </div>
    <div class="body">
      ${ang?`<p class="sec">Sections inside the email</p><ol class="ang">${ang}</ol>`:""}
      ${ev?`<p class="sec">Where it's running${t.o?` · ${t.o} outlets`:""}</p><ul class="ev">${ev}</ul>`:""}
      ${nx?`<p class="sec">Notes</p><ul class="notes">${nx}</ul>`:""}
    </div>
  </article>`;
}
function render(){
  document.querySelectorAll("#catbar .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===fCat));
  document.querySelectorAll("#fmtbar .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===fFmt));
  const starBtn=document.getElementById("onlyStar"); if(starBtn) starBtn.setAttribute("aria-pressed",fStar);
  const list=T.filter(hit), pk=list.filter(t=>t.pick), rest=list.filter(t=>!t.pick);
  document.getElementById("grid").innerHTML =
    (pk.length?`<div class="band"><h2>Shortlist</h2><span>${pk.length}</span></div>`+pk.map(card).join(""):"")+
    (rest.length?`<div class="band"><h2>The rest of the bank</h2><span>${rest.length}</span></div>`+rest.map(card).join(""):"");
  document.getElementById("empty").hidden=list.length>0;
  document.getElementById("count").textContent=
    `${list.length} of ${T.length} newsletters · ${list.reduce((a,b)=>a+b.a.length,0)} sections`;
  paint();
}
function paint(){
  document.querySelectorAll(".card").forEach(c=>{
    const id=c.dataset.id;
    const sb=c.querySelector(".star");
    if(sb){
      const n=SHARED?(STARS[id]||0):(MYSTARS.has(id)?1:0);
      sb.querySelector(".sc").textContent=n||"";
      const on=MYSTARS.has(id);
      sb.classList.toggle("on",on); sb.setAttribute("aria-pressed",on);
      sb.title=on?"Remove your star":"Star this one";
    }
    const list=IDEAS[id]||[];
    const ul=c.querySelector("[data-ilist]");
    if(ul) ul.innerHTML=list.map(i=>`<li data-cid="${esc(i.id)}"><div class="itext">${esc(i.text)}</div>
      <div class="imeta"><span class="iwho">${esc(i.who)}${i.ed?" · edited":""}</span>
      ${i.mine?`<span class="iact"><button type="button" data-edit="${esc(i.id)}">Edit</button><button type="button" data-del="${esc(i.id)}">Delete</button></span>`:""}
      </div></li>`).join("");
    const bar=c.querySelector("[data-ibar]");
    if(bar&&!bar.dataset.built){
      bar.dataset.built="1";
      bar.innerHTML=`<textarea rows="1" placeholder="Add a comment…"></textarea><button type="button">Post</button>`;
      const ta=bar.querySelector("textarea"), btn=bar.querySelector("button");
      const send=async()=>{ const v=ta.value.trim(); if(!v) return; ta.value=""; await addIdea(id,v.slice(0,1200)); };
      btn.onclick=send;
      ta.onkeydown=e=>{ if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); send(); } };
    }
  });
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const mo=e.target.closest("[data-more]");
  if(mo){ const id=mo.dataset.more, c=mo.closest(".card");
    const on=!OPEN.has(id);
    on?OPEN.add(id):OPEN.delete(id);
    c.classList.toggle("on",on);
    mo.setAttribute("aria-expanded",on);
    mo.textContent=on?"Hide":c.querySelectorAll("ol.ang li").length+" sections";
    return; }
  const s=e.target.closest("[data-star]"); if(s){ star(s.dataset.star); return; }
  const d=e.target.closest("[data-del]");
  if(d){ if(d.dataset.armed){ delIdea(d.dataset.del); return; }
    d.dataset.armed="1"; d.textContent="Sure?";
    setTimeout(()=>{ if(d.isConnected){ delete d.dataset.armed; d.textContent="Delete"; } },3500); return; }
  const ed=e.target.closest("[data-edit]");
  if(ed){
    const li=ed.closest("li"), cid=ed.dataset.edit;
    if(li.querySelector(".iedit")) return;
    const box=li.querySelector(".itext"), cur=box.textContent;
    box.outerHTML=`<div class="iedit"><textarea rows="2"></textarea><button type="button" class="sv">Save</button><button type="button" class="cx">Cancel</button></div>`;
    const w=li.querySelector(".iedit"), ta=w.querySelector("textarea");
    ta.value=cur; ta.focus(); ta.setSelectionRange(cur.length,cur.length);
    li.querySelector(".iact").style.visibility="hidden";
    w.querySelector(".cx").onclick=()=>paint();
    w.querySelector(".sv").onclick=()=>{ const v=ta.value.trim(); v?saveIdea(cid,v):paint(); };
    ta.onkeydown=k=>{ if(k.key==="Escape"){k.preventDefault();paint();}
      if(k.key==="Enter"&&(k.metaKey||k.ctrlKey)){k.preventDefault(); const v=ta.value.trim(); if(v) saveIdea(cid,v);} };
  }
});
document.getElementById("q").oninput=e=>{ q=e.target.value.toLowerCase().trim(); render(); };
document.getElementById("expand").onclick=()=>{ T.forEach(t=>OPEN.add(t.id)); render(); };
document.getElementById("collapse").onclick=()=>{ OPEN.clear(); render(); };

/* ---------- export ---------- */
function report(){
  const byId={}; T.forEach(t=>byId[t.id]=t.n);
  const starred=[...MYSTARS].filter(id=>byId[id]);
  const keys=Object.keys(IDEAS).filter(k=>byId[k]&&IDEAS[k].length);
  let s="Health Topic Bank feedback\n";
  if(L.who) s+="From: "+L.who+"\n";
  s+="Date: "+new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})+"\n\n";
  s+="STARRED ("+starred.length+")\n";
  s+=starred.length?starred.map(id=>"- "+byId[id]).join("\n")+"\n\n":"None\n\n";
  s+="COMMENTS\n";
  if(!keys.length) s+="None\n";
  keys.forEach(k=>{ s+="\n"+byId[k]+"\n"; IDEAS[k].forEach(i=>{ s+="- "+i.text+"\n"; }); });
  return s;
}
function tally(){
  const n=MYSTARS.size, c=Object.values(IDEAS).reduce((a,v)=>a+v.length,0);
  const el=document.getElementById("tally");
  if(el) el.innerHTML=`<b>${n}</b> starred · <b>${c}</b> comment${c===1?"":"s"}`;
  const ct=document.getElementById("starCt"); if(ct) ct.textContent=SHARED?Object.keys(STARS).length:n;
}
function wireBar(){
  const who=document.getElementById("who");
  who.value=L.who||"";
  who.oninput=()=>{ L.who=who.value.slice(0,60); ME=L.who||ME; lsave();
    if(!SHARED){ rebuildLocal(); } paint(); tally(); };
  const nudge=()=>{ if(!L.who){ who.focus(); who.style.borderColor="var(--accent)"; setTimeout(()=>who.style.borderColor="",2000); } };
  document.getElementById("copyFb").onclick=async function(){ nudge();
    try{ await navigator.clipboard.writeText(report()); this.textContent="Copied"; setTimeout(()=>this.textContent="Copy",1600); }catch(_){} };
  document.getElementById("mailFb").onclick=()=>{ nudge();
    const sub="Health Topic Bank feedback"+(L.who?" from "+L.who:"");
    location.href="mailto:"+SB.to+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent(report()); };
  document.getElementById("dlFb").onclick=()=>{ nudge();
    const b=new Blob([report()],{type:"text/plain"}), a=document.createElement("a");
    a.href=URL.createObjectURL(b); a.download="topic-bank-feedback.txt";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); };
}

/* ---------- history strip ---------- */
document.getElementById("hist").innerHTML =
  `<div class="hl">Already shipped${HIST.some(x=>x.gap)?" · one gap":""}</div><ul>`+
  HIST.map(x=>`<li class="${x.next?"next":(x.gap?"gap":"")}">${esc(x.t)}</li>`).join("")+`</ul>`;

document.getElementById("foot").textContent =
  "Topics sourced 18 August to 1 October 2026 from Healthline Wellness Wire, Mount Sinai HealthCast, WebMD, Medical News Today, ScienceDaily, Axios, WSJ Wellness, Vogue, EatingWell and Dermatology Times, plus the health newsletters in your inboxes, the H2 content doc and the October organic social calendar. Shipped newsletters are listed at the top and removed from the bank. Quoted headlines are verbatim; sections are proposed, not sourced.";

/* ---------- boot ---------- */
chipRow(document.getElementById("catbar"),"Health category",
  [...new Set(T.map(t=>t.cat))].sort().map(c=>({v:c,t:c,c:T.filter(t=>t.cat===c).length})),
  ()=>fCat, v=>fCat=v);
chipRow(document.getElementById("fmtbar"),"Format",
  [...new Set(T.flatMap(t=>t.p))].sort().map(c=>({v:c,t:c,c:T.filter(t=>t.p.includes(c)).length})),
  ()=>fFmt, v=>fFmt=v);

(async()=>{
  lload();
  ME = L.who || "";
  const fb=document.getElementById("fbbar");
  fb.hidden=false;
  fb.innerHTML=`<div class="rowlabel">Feedback</div><button class="chip" id="onlyStar" aria-pressed="false">Starred only<span class="ct" id="starCt">0</span></button>`;
  document.getElementById("onlyStar").onclick=()=>{ fStar=!fStar; render(); };

  if(SB.url && SB.key){
    try{
      if(!ME){ ME = "guest-" + Math.random().toString(36).slice(2,8); }
      await pull();
      SHARED=true;
      document.getElementById("sync").textContent="Shared · saves for everyone";
      document.getElementById("expnote").textContent="Everything you star or comment saves for everyone with this link.";
      setInterval(async()=>{ try{ await pull(); paint(); tally(); }catch(_){} }, 10000);
    }catch(_){ SHARED=false; }
  }
  if(!SHARED){
    rebuildLocal();
    document.getElementById("sync").textContent="This browser only";
    document.getElementById("expnote").textContent="Saved in this browser. Use Email it or Copy to send your notes back.";
  }
  document.body.classList.add("live","bar-on");
  wireBar(); render(); tally();
})();
</script>
</body>
</html>
